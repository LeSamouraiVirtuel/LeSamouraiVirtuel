<title>Le Village du Pôle</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0d1b33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: full-screen 3D village; resource HUD pinned to the top edge, quest card + sleigh button + building sheet on the bottom edge. Single deliberate "winter night" look. */
:root{
  --night:#0d1b33; --night-2:#18305a; --snow:#f4f8ff; --ice:#a9c4ea; --berry:#d42a45; --gold:#ffc94a; --pine:#2a8a5f; --ink:#0b1424;
  --panel:rgba(12,25,48,.88); --panel-line:rgba(169,196,234,.22); --muted:#9fb3d4; --bad:#ff7a7a;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--snow);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:5}
#res{display:flex;gap:6px}
.res{flex:1;min-width:0;display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--panel-line);border-radius:999px;padding:3px 8px 3px 3px;position:relative;overflow:hidden;transition:transform .15s}
.res.pulse{transform:scale(1.08)}
.res .ic{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:15px}
.res .v{font-family:var(--display);font-size:15px;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .fill{position:absolute;left:32px;right:10px;bottom:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.08)}
.res .fill i{display:block;height:100%;border-radius:2px;background:var(--ice);width:0;transition:width .3s}
.res.full .fill i{background:var(--bad)}
#rank{display:flex;align-items:center;gap:8px}
#rankcard{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:4px 10px 4px 4px;min-width:0}
#avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:20px;background:linear-gradient(160deg,var(--berry),#8c1426);flex:none}
#rankcard b{font-family:var(--display);font-weight:400;font-size:15px;display:block;line-height:1.1;letter-spacing:.02em}
#rankcard small{color:var(--muted);font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
#stars{margin-left:auto;font-family:var(--display);background:var(--panel);border:1px solid var(--panel-line);border-radius:999px;padding:6px 12px;font-size:15px;font-variant-numeric:tabular-nums}
#sound{pointer-events:auto;background:var(--panel);border:1px solid var(--panel-line);border-radius:50%;width:34px;height:34px;font-size:16px}

/* ---------- overlays projected from 3D ---------- */
#ov{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.ov{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:3px;will-change:transform}
.bubble{pointer-events:auto;display:flex;align-items:center;gap:3px;background:var(--snow);color:var(--ink);border-radius:999px;padding:3px 9px 3px 4px;font-family:var(--display);font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:bob 1.2s ease-in-out infinite}
.bubble .e{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:#dde8f7;font-size:15px}
.bubble.full{background:var(--gold)}
@keyframes bob{50%{transform:translateY(-5px)}}
.timer{background:var(--panel);border:1px solid var(--panel-line);border-radius:8px;padding:3px 7px 5px;font-size:11.5px;font-weight:900;min-width:66px;text-align:center;font-variant-numeric:tabular-nums}
.timer .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.12);margin-top:3px;overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--gold)}
.plus{width:30px;height:30px;border-radius:50%;border:2px dashed rgba(244,248,255,.55);display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--snow);background:rgba(13,27,51,.35)}
.lock{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:6px 12px;text-align:center}
.lock b{font-family:var(--display);font-weight:400;font-size:16px;display:block;letter-spacing:.02em}
.lock small{color:var(--muted);font-weight:800;font-size:12px}
.lvtag{font-family:var(--display);font-size:12px;background:rgba(12,25,48,.75);border-radius:6px;padding:1px 6px;color:var(--snow)}

/* ---------- bottom: quest + sleigh ---------- */
#bottom{position:fixed;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));display:flex;align-items:flex-end;gap:10px;z-index:4;pointer-events:none;transition:transform .3s,opacity .3s}
body.sheet-open #bottom{transform:translateY(30px);opacity:0}
#quest{pointer-events:auto;flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;padding:10px 12px;text-align:left}
#quest .qi{width:38px;height:38px;flex:none;border-radius:12px;background:rgba(255,201,74,.16);display:grid;place-items:center;font-size:20px}
#quest .qt{min-width:0;flex:1}
#quest small{display:block;color:var(--gold);font-weight:900;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
#quest span{display:block;font-weight:800;font-size:13.5px;line-height:1.25}
#quest .qp{height:4px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:5px;overflow:hidden}
#quest .qp i{display:block;height:100%;background:var(--gold)}
#quest.done{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,201,74,.35),0 0 24px rgba(255,201,74,.35);animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 2px rgba(255,201,74,.6),0 0 34px rgba(255,201,74,.55)}}
#sleigh{pointer-events:auto;width:76px;flex:none;background:linear-gradient(170deg,var(--berry),#8c1426);border-radius:20px;padding:8px 4px 7px;box-shadow:0 5px 0 #5c0c19;display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .1s}
#sleigh:active{transform:translateY(3px);box-shadow:0 2px 0 #5c0c19}
#sleigh .se{font-size:28px;line-height:1}
#sleigh b{font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:.02em}
#sleigh small{font-size:11px;font-weight:900;opacity:.9;font-variant-numeric:tabular-nums}
#sleigh.off{filter:grayscale(.85) brightness(.7)}

/* ---------- sheet ---------- */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--panel-line);border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));max-height:62%;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1.1)}
body.sheet-open #sheet{transform:none}
#sheet .hd{display:flex;align-items:center;gap:12px}
#sheet .big{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:28px;flex:none}
#sheet h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;line-height:1.05;letter-spacing:.02em;text-wrap:balance}
#sheet .sub{color:var(--muted);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
#sheet .x{margin-left:auto;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);font-size:20px;flex:none}
#sheet p{margin:10px 0 0;font-size:14px;line-height:1.45;color:#d8e4f6;max-width:60ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.stat{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 10px}
.stat small{display:block;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.stat b{font-family:var(--display);font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;color:var(--pine);filter:brightness(1.5);font-size:14px}
.costs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.chip{background:rgba(255,255,255,.08);border-radius:999px;padding:4px 10px;font-weight:900;font-size:13.5px;font-variant-numeric:tabular-nums}
.chip.bad{color:var(--bad);background:rgba(255,122,122,.12)}
.note{margin-top:10px;font-size:12.5px;font-weight:800;color:var(--gold)}
.note.bad{color:var(--bad)}
.acts{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;font-family:var(--display);font-size:17px;letter-spacing:.02em;padding:12px 10px;border-radius:14px;background:var(--pine);box-shadow:0 4px 0 #13513a;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #13513a}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #b88a17}
.btn.red{background:var(--berry);box-shadow:0 4px 0 #8c1426}
.btn[disabled]{filter:grayscale(1) brightness(.6);pointer-events:none}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:14px;padding:8px 10px;text-align:left;width:100%}
.item .big{width:44px;height:44px;font-size:24px;border-radius:12px}
.item .it{flex:1;min-width:0}
.item b{font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.02em}
.item .costs{margin-top:4px;gap:4px}
.item .chip{font-size:12px;padding:2px 8px}
.item.locked{opacity:.5}
.item .why{font-size:12px;font-weight:800;color:var(--muted)}
.prog{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--gold)}

/* ---------- misc ---------- */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 100px);transform:translate(-50%,-20px);background:var(--snow);color:var(--ink);font-weight:900;font-size:14px;padding:9px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.35);opacity:0;transition:.25s;z-index:9;pointer-events:none;max-width:calc(100% - 40px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.fly{position:fixed;left:0;top:0;z-index:8;pointer-events:none;font-family:var(--display);font-size:20px;color:var(--snow);text-shadow:0 2px 0 rgba(0,0,0,.4);transition:transform .75s cubic-bezier(.5,-0.3,.6,1),opacity .75s;white-space:nowrap}
#intro{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end;padding:0 max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(24px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(13,27,51,0) 25%,rgba(13,27,51,.75) 55%,var(--night) 85%);transition:opacity .5s}
#intro.hide{opacity:0;pointer-events:none}
#intro .eyebrow{font-weight:900;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
#intro h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,13vw,76px);line-height:.92;margin:8px 0 12px;letter-spacing:.01em;text-wrap:balance;text-shadow:0 4px 0 rgba(0,0,0,.35)}
#intro h1 span{color:var(--berry);display:block}
#intro p{margin:0 0 22px;font-size:16px;line-height:1.45;color:#d8e4f6;max-width:34ch}
#intro .btn{flex:none;font-size:22px;padding:16px;max-width:420px;background:var(--berry);box-shadow:0 5px 0 #8c1426}
#intro .reset{margin-top:14px;color:var(--muted);font-weight:800;font-size:13px;align-self:flex-start;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.bubble,#quest.done{animation:none}}
@media (min-width:700px){#sheet{left:50%;right:auto;width:520px;margin-left:-260px}#bottom{max-width:640px;margin:0 auto}}
</style>

<canvas id="c"></canvas>
<div id="ov"></div>

<div id="hud">
  <div id="res"></div>
  <div id="rank">
    <div id="rankcard"><div id="avatar">🧝</div><div><b id="rankname">Lutin apprenti</b><small id="ranksub">Maison niv. 1</small></div></div>
    <div id="stars">⭐ 0</div>
    <button id="sound" aria-label="Couper le son">🔊</button>
  </div>
</div>

<div id="bottom">
  <button id="quest"><div class="qi">📜</div><div class="qt"><small>Objectif</small><span id="qtext"></span><div class="qp" id="qprog" hidden><i></i></div></div></button>
  <button id="sleigh"><span class="se">🛷</span><b>Tournée</b><small id="sleighsub">—</small></button>
</div>

<div id="sheet" role="dialog" aria-live="polite"></div>
<div id="toast"></div>

<div id="intro">
  <div class="eyebrow">Un jeu de fin d'année</div>
  <h1>Le Village du Pôle<span>Deviens le Père Noël</span></h1>
  <p>Tu n'es qu'un petit lutin au pied de la montagne. Construis ton camp, fais tourner les ateliers, livre les cadeaux… et monte jusqu'au sommet pour devenir le Père Noël.</p>
  <button class="btn" id="play">Commencer</button>
  <button class="reset" id="reset" hidden>Recommencer une nouvelle partie</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

/* =====================================================================
   DONNÉES DU JEU
   ===================================================================== */
const RES = {
  coins:   {ic:'🪙', name:'Pièces'},
  wood:    {ic:'🪵', name:'Bois'},
  cookies: {ic:'🍪', name:'Biscuits'},
  gifts:   {ic:'🎁', name:'Cadeaux'},
};
const TYPES = {
  hq:      {name:'Maison du Père Noël', ic:'🏠', h:4.6, desc:"Le cœur du village. Son niveau limite celui des autres bâtiments et débloque les terrains plus haut sur la montagne.", cost:{coins:150,wood:120,cookies:25}, time:10},
  sawmill: {name:'Scierie', ic:'🪓', h:2.8, prod:'wood', rate:30, desc:"Les lutins abattent les vieux sapins et les débitent en planches.", cost:{coins:60,wood:30}, time:5, hq:1},
  bakery:  {name:'Four à biscuits', ic:'🍪', h:3.0, prod:'cookies', rate:20, desc:"Des biscuits au gingembre tout chauds. Indispensables pour motiver les lutins sur les gros chantiers.", cost:{coins:80,wood:60}, time:6, hq:1},
  post:    {name:'Bureau des lettres', ic:'✉️', h:2.8, prod:'coins', rate:40, desc:"Les lettres des enfants arrivent ici, souvent avec une petite pièce pour le village.", cost:{coins:30,wood:50}, time:6, hq:1},
  workshop:{name:'Atelier des lutins', ic:'🧸', h:3.0, prod:'gifts', rate:10, desc:"On y fabrique les jouets et on emballe les cadeaux, un nœud après l'autre.", cost:{coins:150,wood:120,cookies:30}, time:8, hq:2},
  storage: {name:'Entrepôt', ic:'📦', h:2.6, desc:"Agrandit le stock maximum de toutes les ressources.", cost:{coins:120,wood:150}, time:8, hq:2},
  stable:  {name:'Écurie des rennes', ic:'🦌', h:3.0, unique:true, desc:"Les rennes tirent le traîneau. Chaque niveau ajoute de la place pour les cadeaux d'une tournée.", cost:{coins:300,wood:250,cookies:100}, time:12, hq:3},
};
const BUILDABLE = ['sawmill','bakery','post','workshop','storage','stable'];
const MAX_LV = 10, BUILDERS = 2, HQ_ID = '0-1-1';
const RANKS = ['Lutin apprenti','Lutin confirmé','Chef des lutins','Maître jouetier','Gardien des rennes','Héraut de l\'hiver','Seigneur des neiges','Prince du Pôle','Presque Père Noël','Père Noël'];
const ZONES = [
  {hq:1, name:'Le Camp du bas'},
  {hq:3, name:'Les Pentes enneigées'},
  {hq:5, name:'La Forêt des sapins'},
  {hq:7, name:'Le Sommet du Pôle'},
];
const ZONE_D = 10, ZONE_H = 1.25, COLS = [-4.6, 0, 4.6], ROWS = [2.4, -2.4];

const rate     = (t, lv) => Math.round(TYPES[t].rate * Math.pow(1.45, lv - 1));
const bufCap   = (t, lv) => rate(t, lv) * 3;
const r5       = n => Math.max(5, Math.round(n / 5) * 5);
const costOf   = (t, lv) => { const c = {}, m = Math.pow(1.65, lv - 1); for (const k in TYPES[t].cost) c[k] = r5(TYPES[t].cost[k] * m); return c; };
const timeOf   = (t, lv) => Math.round(TYPES[t].time * Math.pow(1.55, lv - 1));
const sleighCapOf = lv => lv > 0 ? 20 + 15 * (lv - 1) : 0;
const DELIVERY_MS = 20000;

/* =====================================================================
   ÉTAT + SAUVEGARDE
   ===================================================================== */
const SAVE_KEY = 'village-du-pole-v1';
function newState(){
  return {
    v:1, res:{coins:250, wood:150, cookies:20, gifts:0}, stars:0,
    plots:{
      [HQ_ID]:  {type:'hq', lv:1, buf:0},
      '0-0-0':  {type:'sawmill', lv:1, buf:25},
      '0-0-2':  {type:'post', lv:1, buf:40},
    },
    quest:0, stats:{wood:0, gifts:0, delivered:0, trips:0}, delivery:null, t:Date.now(),
  };
}
function load(){ try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.v === 1) return s; } catch(e){} return null; }
function save(){ state.t = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e){} }
const saved = load();
let state = saved || newState();

const hqLv = () => state.plots[HQ_ID].lv;
const zoneOpen = k => hqLv() >= ZONES[k].hq;
const plotsOf = t => Object.values(state.plots).filter(p => p.type === t);
const bestLv = t => plotsOf(t).reduce((m, p) => Math.max(m, p.lv), 0);
const maxCount = t => TYPES[t].unique ? 1 : t === 'storage' ? 1 + Math.floor(hqLv() / 4) : 1 + Math.floor(hqLv() / 2);
const busyBuilders = () => Object.values(state.plots).filter(p => p.upEnd).length;
function storeCap(){
  let c = 500 + 300 * (hqLv() - 1);
  for (const p of plotsOf('storage')) if (p.lv > 0) c += Math.round(600 * Math.pow(1.6, p.lv - 1));
  return c;
}
const sleighCap = () => sleighCapOf(bestLv('stable'));
const canAfford = c => Object.keys(c).every(k => state.res[k] >= c[k]);
const fitsStore = c => Object.keys(c).every(k => c[k] <= storeCap());

const QUESTS = [
  {t:'Touche la bulle 🪵 au-dessus de la Scierie pour récolter du bois', ok:s => s.stats.wood > 0, rw:{coins:50}},
  {t:'Construis un Four à biscuits sur un terrain libre (+)', ok:() => bestLv('bakery') >= 1, rw:{coins:80, wood:40}},
  {t:'Améliore la Maison du Père Noël au niveau 2', ok:() => hqLv() >= 2, rw:{coins:120, wood:80}},
  {t:'Améliore la Scierie au niveau 2', ok:() => bestLv('sawmill') >= 2, rw:{coins:100}},
  {t:"Construis l'Atelier des lutins", ok:() => bestLv('workshop') >= 1, rw:{cookies:60}},
  {t:"Emballe 30 cadeaux à l'Atelier", ok:s => s.stats.gifts >= 30, prog:s => [s.stats.gifts, 30], rw:{coins:200}},
  {t:'Maison niveau 3 : débloque les Pentes enneigées', ok:() => hqLv() >= 3, rw:{coins:250, wood:200}},
  {t:"Construis l'Écurie des rennes", ok:() => bestLv('stable') >= 1, rw:{gifts:20}},
  {t:'Lance une tournée en traîneau', ok:s => s.stats.trips >= 1, rw:{coins:300}},
  {t:'Livre 150 cadeaux aux enfants', ok:s => s.stats.delivered >= 150, prog:s => [s.stats.delivered, 150], rw:{coins:500, cookies:200}},
  {t:'Maison niveau 5 : débloque la Forêt des sapins', ok:() => hqLv() >= 5, rw:{coins:800, wood:600}},
  {t:'Maison niveau 7 : débloque le Sommet du Pôle', ok:() => hqLv() >= 7, rw:{coins:1500, wood:1200}},
  {t:'Maison niveau 10 : deviens le Père Noël !', ok:() => hqLv() >= 10, rw:{coins:5000}},
];

/* =====================================================================
   SON (petits bips synthétisés)
   ===================================================================== */
let actx = null, soundOn = true;
function tone(f, d = .12, type = 'sine', v = .07){
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);

function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
{

/* =====================================================================
   SIMULATION
   ===================================================================== */
function simulate(dt, now){
  for (const id in state.plots){
    const p = state.plots[id];
    if (p.upEnd && now >= p.upEnd){
      p.lv = p.upTo; delete p.upEnd; delete p.upTo;
      if (!offline){ sfx.level(); toast(`${TYPES[p.type].name} : niveau ${p.lv} !`); }
      if (p.type === 'hq'){ onHqLevel(); }
    }
    const T = TYPES[p.type];
    if (T.prod && p.lv > 0 && !p.upEnd) p.buf = Math.min(bufCap(p.type, p.lv), (p.buf || 0) + rate(p.type, p.lv) / 60 * dt);
  }
  if (state.delivery && now >= state.delivery.end){
    const a = state.delivery.amount; state.delivery = null;
    gain({coins:a * 6}); state.stars += a; state.stats.delivered += a;
    if (!offline){ sfx.level(); toast(`Tournée terminée ! ${a} enfants heureux · +${a * 6} 🪙 · +${a} ⭐`); }
  }
}
let offline = false;
function onHqLevel(){
  if (offline) return;
  makeSanta();
  const k = ZONES.findIndex(z => z.hq === hqLv());
  if (k > 0) setTimeout(() => { toast(`Nouveau terrain : ${ZONES[k].name} !`); cam.tz = zoneZ(k) + 2; }, 900);
}
function gain(c){ const cap = storeCap(); for (const k in c) state.res[k] = Math.min(Math.max(cap, state.res[k]), state.res[k] + c[k]); }
function pay(c){ for (const k in c) state.res[k] -= c[k]; }

function collect(id, fromEl){
  const p = state.plots[id], T = TYPES[p.type]; if (!T.prod) return false;
  const have = Math.floor(p.buf || 0); if (have < 1) return false;
  const space = Math.max(0, storeCap() - state.res[T.prod]);
  const take = Math.min(have, space);
  if (take <= 0){ sfx.err(); toast('Stock plein ! Améliore la Maison ou construis un Entrepôt.'); return true; }
  state.res[T.prod] += take; p.buf -= take;
  if (T.prod === 'wood') state.stats.wood += take;
  if (T.prod === 'gifts') state.stats.gifts += take;
  sfx.collect(); flyText(`+${take} ${RES[T.prod].ic}`, fromEl, T.prod);
  return true;
}
function upgradeBlock(id){
  const p = state.plots[id]; const to = p.lv + 1;
  if (p.upEnd) return 'Chantier en cours';
  if (to > MAX_LV) return 'Niveau maximum atteint';
  if (p.type !== 'hq' && to > hqLv()) return `Améliore d'abord la Maison au niveau ${to}`;
  const c = costOf(p.type, to);
  if (!fitsStore(c)) return 'Stock trop petit : construis ou améliore un Entrepôt';
  if (busyBuilders() >= BUILDERS) return `Tes ${BUILDERS} lutins bâtisseurs sont occupés`;
  if (!canAfford(c)) return 'Ressources insuffisantes';
  return null;
}
function upgrade(id){
  const why = upgradeBlock(id); if (why){ sfx.err(); toast(why); return; }
  const p = state.plots[id], to = p.lv + 1, c = costOf(p.type, to);
  pay(c); collect(id); p.upTo = to; p.upEnd = Date.now() + timeOf(p.type, to) * 1000; sfx.build(); save();
}
function buildBlock(t){
  const T = TYPES[t];
  if (hqLv() < T.hq) return `Maison niveau ${T.hq} requise`;
  if (plotsOf(t).length >= maxCount(t)) return T.unique ? 'Déjà construit' : `Maximum ${maxCount(t)} pour l'instant`;
  if (busyBuilders() >= BUILDERS) return 'Lutins bâtisseurs occupés';
  if (!canAfford(costOf(t, 1))) return 'Ressources insuffisantes';
  return null;
}
function build(id, t){
  const why = buildBlock(t); if (why){ sfx.err(); toast(why); return; }
  pay(costOf(t, 1));
  state.plots[id] = {type:t, lv:0, buf:0, upTo:1, upEnd:Date.now() + timeOf(t, 1) * 1000};
  sfx.build(); save(); renderSheet();
}
const speedCost = p => Math.max(5, Math.ceil((p.upEnd - Date.now()) / 1000 * 1.5));
function speedUp(id){
  const p = state.plots[id]; if (!p.upEnd) return;
  const c = speedCost(p); if (state.res.coins < c){ sfx.err(); toast('Pas assez de pièces'); return; }
  state.res.coins -= c; p.upEnd = Date.now();
}
function startDelivery(){
  if (state.delivery) { toast(`Le traîneau revient dans ${fmtTime((state.delivery.end - Date.now()) / 1000)}`); return; }
  if (bestLv('stable') < 1){ sfx.err(); toast("Construis l'Écurie des rennes (Maison niv. 3) pour débloquer le traîneau"); return; }
  if (state.res.gifts < 1){ sfx.err(); toast("Pas de cadeaux à livrer : récolte l'Atelier des lutins"); return; }
  const a = Math.min(state.res.gifts, sleighCap());
  state.res.gifts -= a; state.stats.trips++;
  state.delivery = {amount:a, start:Date.now(), end:Date.now() + DELIVERY_MS};
  sfx.level(); toast(`Le traîneau s'envole avec ${a} 🎁 !`); save();
}

for (let k = 1; k < 4; k++){ const d = document.createElement('div'); d.className = 'ov'; d.innerHTML = `<div class="lock"><b>🔒 ${ZONES[k].name}</b><small>Maison du Père Noël niveau ${ZONES[k].hq}</small></div>`; ovRoot.appendChild(d); lockOv[k] = d; }
ovRoot.addEventListener('pointerdown', e => {
  const b = e.target.closest('.bubble'); if (!b) return;
  e.stopPropagation(); collect(b.dataset.id, b);
});
function overlayHtml(id){
  const p = state.plots[id], [k] = id.split('-').map(Number);
  if (!zoneOpen(k)) return '';
  if (!p) return `<div class="plus">+</div>`;
  if (p.upEnd){
    const total = timeOf(p.type, p.upTo) * 1000, left = p.upEnd - Date.now();
    return `<div class="timer">${fmtTime(left / 1000)}<div class="bar"><i style="width:${Math.min(100, (1 - left / total) * 100)}%"></i></div></div>`;
  }
  const T = TYPES[p.type];
  if (T.prod && (p.buf || 0) >= Math.max(1, rate(p.type, p.lv) * .2)){
    const full = p.buf >= bufCap(p.type, p.lv) - .01;
    return `<div class="bubble ${full ? 'full' : ''}" data-id="${id}"><span class="e">${RES[T.prod].ic}</span><span class="n"></span></div>`;
  }
  return '';
}
const v3 = new THREE.Vector3();
function project(pos){ v3.copy(pos).project(camera); return {x:(v3.x + 1) / 2 * innerWidth, y:(1 - v3.y) / 2 * innerHeight, on:v3.z < 1}; }
let ovTick = 0;
function updateOverlays(dt){
  ovTick -= dt; const refresh = ovTick <= 0; if (refresh) ovTick = .2;
  for (const id of ALL_PLOTS){
    const o = ovs[id];
    if (refresh){ const h = overlayHtml(id); if (h !== o.html){ o.html = h; o.el.innerHTML = h; } const n = o.el.querySelector('.n'); if (n) n.textContent = fmt(state.plots[id].buf); }
    if (!o.html){ o.el.style.display = 'none'; continue; }
    const p = state.plots[id], base = plotPos(id);
    base.y += p ? (p.upEnd && p.lv === 0 ? 2.4 : TYPES[p.type].h * (plotViews[id].baseScale || 1)) : .5;
    const s = project(base);
    o.el.style.display = s.on && s.y > 110 ? '' : 'none';
    o.el.style.transform = `translate(${s.x}px,${s.y}px) translate(-50%,-100%)`;
  }
  for (let k = 1; k < 4; k++){
    const d = lockOv[k];
    if (zoneOpen(k)){ d.style.display = 'none'; continue; }
    const s = project(new THREE.Vector3(0, zoneY(k) + 1.5, zoneZ(k)));
    d.style.display = s.on && s.y > 150 ? '' : 'none';
    d.style.transform = `translate(${s.x}px,${s.y}px) translate(-50%,-50%)`;
  }
}

/* =====================================================================
   CONTRÔLES : glisser pour se déplacer, pincer pour zoomer, toucher pour agir
   ===================================================================== */
const pointers = new Map(); let dragDist = 0, pinch0 = 0, dist0 = 0;
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, {x:e.clientX, y:e.clientY}); dragDist = 0; if (pointers.size === 2){ const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); dist0 = cam.tdist; } });
canvas.addEventListener('pointermove', e => {
  const prev = pointers.get(e.pointerId); if (!prev) return;
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y; prev.x = e.clientX; prev.y = e.clientY;
  if (pointers.size === 2){ const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); cam.tdist = THREE.MathUtils.clamp(dist0 * pinch0 / d, 13, 44); dragDist = 99; return; }
  dragDist += Math.abs(dx) + Math.abs(dy);
  const f = cam.dist / innerHeight * 1.25;
  cam.tx = THREE.MathUtils.clamp(cam.tx - dx * f, -10, 10);
  cam.tz = THREE.MathUtils.clamp(cam.tz - dy * f * 1.4, zoneZ(3) - 6, 6);
  cam.x = cam.tx; cam.z = cam.tz;
});
const endPtr = e => {
  const had = pointers.has(e.pointerId); pointers.delete(e.pointerId);
  if (had && pointers.size === 0 && dragDist < 10 && e.type === 'pointerup') tap(e.clientX, e.clientY);
};
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.tdist = THREE.MathUtils.clamp(cam.tdist * (1 + e.deltaY * .001), 13, 44); }, {passive:false});

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function tap(x, y){
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, true).find(h => h.object.visible);
  let id = null; for (let o = hit && hit.object; o; o = o.parent) if (o.userData.plot){ id = o.userData.plot; break; }
  if (!id){ closeSheet(); return; }
  const [k] = id.split('-').map(Number);
  if (!zoneOpen(k)){ sfx.err(); toast(`🔒 Maison du Père Noël niveau ${ZONES[k].hq} requise`); return; }
  const p = state.plots[id];
  if (p && !p.upEnd && TYPES[p.type].prod && (p.buf || 0) >= Math.max(1, rate(p.type, p.lv) * .2) && sel !== id){ collect(id, ovs[id].el); return; }
  sfx.tap(); openSheet(id);
}

/* =====================================================================
   BOUCLE
   ===================================================================== */
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < .7 ? 50 : 36; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// rattrapage hors-ligne
{
  const now = Date.now(), away = Math.min(8 * 3600, (now - (state.t || now)) / 1000);
  offline = true; simulate(away, now); offline = false;
  if (saved && away > 60) setTimeout(() => toast(`Les lutins ont travaillé pendant ton absence (${fmtTime(away)})`), 1200);
}
for (const id of ALL_PLOTS) syncPlot(id);
makeSanta(); syncElves();

const clock = new THREE.Clock(); let last = Date.now(), smokeT = 0, saveT = 0, sheetT = 0, t = 0;
const camTarget = new THREE.Vector3();
function frame(){
  requestAnimationFrame(frame);
  const now = Date.now(); const sdt = Math.min(8 * 3600, (now - last) / 1000); last = now;
  const dt = Math.min(.05, clock.getDelta()); t += dt;
  const prevHq = hqLv();
  simulate(sdt, now);
  for (const id of ALL_PLOTS) syncPlot(id);
  if (hqLv() !== prevHq) syncElves();
  if (Object.values(state.plots).filter(p => p.lv > 0).length + 2 > elves.length) syncElves();

  // caméra
  cam.x += (cam.tx - cam.x) * Math.min(1, dt * 6); cam.z += (cam.tz - cam.z) * Math.min(1, dt * 6); cam.dist += (cam.tdist - cam.dist) * Math.min(1, dt * 8);
  const gy = THREE.MathUtils.lerp(0, zoneY(3), THREE.MathUtils.clamp(-cam.z / (ZONE_D * 3), 0, 1));
  camTarget.set(cam.x, gy, cam.z - 1);
  camera.position.set(cam.x, gy + cam.dist * .78, cam.z + cam.dist * .72);
  camera.lookAt(camTarget);
  moon.position.set(cam.x - 12, gy + 26, cam.z + 10); moon.target.position.copy(camTarget);
  const hp = plotPos(HQ_ID); warm.position.set(hp.x, hp.y + 2.2, hp.z + 2.5);

  // brouillard des zones verrouillées
  for (let k = 1; k < 4; k++) fogs[k].material.opacity += ((zoneOpen(k) ? 0 : .5) - fogs[k].material.opacity) * dt * 2;

  // animations bâtiments
  smokeT -= dt; const doPuff = smokeT <= 0; if (doPuff) smokeT = .35;
  for (const id of ALL_PLOTS){
    const v = plotViews[id]; if (!v.g) continue;
    for (const a of v.anim) a(t, dt);
    if (v.pop < 1){ v.pop = Math.min(1, v.pop + dt / .7); const f = 1 - .45 * Math.exp(-5 * v.pop) * Math.cos(13 * v.pop); v.g.scale.setScalar(v.baseScale * f); }
    if (v.scaffold){ const h = v.scaffold.userData.ham; h.rotation.z = Math.sin(t * 12) * .7; v.g.position.y = Math.abs(Math.sin(t * 6)) * .03; }
    if (doPuff && v.smoke.length && !state.plots[id]?.upEnd) for (const s of v.smoke) if (Math.random() < .7) puff(v.holder.position.clone().add(s));
  }
  for (const s of smokePool){ if (s.life <= 0) continue; s.life -= dt * .45; s.m.position.y += dt * .9; s.m.position.x += s.vx * dt; const sc = .15 + (1 - s.life) * .45; s.m.scale.setScalar(sc); s.m.material.opacity = Math.max(0, s.life * .6); if (s.life <= 0) s.m.visible = false; }
  for (const s of sparkPool){ if (s.life <= 0) continue; s.life -= dt * 1.1; s.v.y -= 9 * dt; s.m.position.addScaledVector(s.v, dt); s.m.rotation.x += dt * 8; s.m.material.opacity = s.life; if (s.life <= 0) s.m.visible = false; }
  LIGHTS.forEach((m, i) => m.emissiveIntensity = Math.sin(t * 3 + i * 1.6) > 0 ? 1.2 : .1);
  pole.userData.star.rotation.y = t; pole.userData.star.material.emissiveIntensity = .8 + Math.sin(t * 2) * .3;

  // neige
  const pa = snowGeo.attributes.position.array;
  for (let i = 0; i < SNOW_N; i++){
    pa[i * 3 + 1] -= snowVel[i] * dt; pa[i * 3] += Math.sin(t + i) * dt * .3;
    if (pa[i * 3 + 1] < 0){ pa[i * 3 + 1] = 26; pa[i * 3] = (Math.random() - .5) * 50; pa[i * 3 + 2] = (Math.random() - .5) * 50; }
  }
  snowGeo.attributes.position.needsUpdate = true; snow.position.set(cam.x, gy - 2, cam.z - 6);

  // père noël + lutins
  if (santa){
    if (santa.lv !== hqLv()) makeSanta();
    const h = plotPos(HQ_ID), g = santa.g;
    santa.wait -= dt;
    if (santa.wait <= 0 && g.position.distanceTo(santa.target) < .1){ santa.target.set(h.x + (Math.random() - .5) * 4, h.y, h.z + 2.2 + Math.random() * 1.2); santa.wait = 2 + Math.random() * 3; }
    walk(g, santa.target, .9, dt, t);
    if (g.position.distanceTo(santa.target) < .1){ g.userData.armR.rotation.z = Math.sin(t * 6) * .6 + 2.4; g.rotation.y += (0 - g.rotation.y) * dt * 4; } else g.userData.armR.rotation.z = 0;
  }
  for (const e of elves){
    if (e.g.position.distanceTo(e.target) < .1){ e.wait -= dt; if (e.wait <= 0){ e.target = pickWalkTarget(); e.wait = 1 + Math.random() * 3; } }
    walk(e.g, e.target, e.speed, dt, t + e.ph);
  }

  // traîneau
  if (state.delivery){
    const d = state.delivery, k = (now - d.start) / (d.end - d.start), up = Math.min(1, k * 6, (1 - k) * 6);
    const a = k * Math.PI * 4;
    const px = cam.x + Math.sin(a) * 8, pz = cam.z - 5 + Math.cos(a) * 6;
    sleigh.visible = true;
    sleigh.position.set(THREE.MathUtils.lerp(hp.x + 1, px, up), THREE.MathUtils.lerp(hp.y + .3, gy + 7 + Math.sin(a * 3) * .8, up), THREE.MathUtils.lerp(hp.z + 2, pz, up));
    sleigh.rotation.set(0, a + Math.PI / 2 + Math.PI, Math.sin(a * 2) * .15 * up);
    if (Math.random() < .5) burst(sleigh.position.clone().add(new THREE.Vector3(0, .2, 0)), 1);
  } else sleigh.visible = false;

  // sélection
  if (sel){ const p = plotPos(sel); selRing.visible = true; selRing.position.set(p.x, p.y + .06, p.z); selRing.scale.setScalar(1 + Math.sin(t * 4) * .04); } else selRing.visible = false;

  renderer.render(scene, camera);
  updateOverlays(dt);
  renderHud();
  sheetT -= dt; if (sel && sheetT <= 0){ sheetT = .5; renderSheet(); }
  saveT -= dt; if (saveT <= 0){ saveT = 5; save(); }
}
function walk(g, target, speed, dt, tt){
  const dx = target.x - g.position.x, dz = target.z - g.position.z, d = Math.hypot(dx, dz);
  const u = g.userData;
  if (d > .1){
    const st = Math.min(d, speed * dt); g.position.x += dx / d * st; g.position.z += dz / d * st;
    g.rotation.y = Math.atan2(dx, dz);
    const sw = Math.sin(tt * 10) * .5; u.legL.rotation.x = sw; u.legR.rotation.x = -sw; u.armL.rotation.x = -sw * .8; u.armR.rotation.x = sw * .8;
  } else { u.legL.rotation.x = u.legR.rotation.x = u.armL.rotation.x = 0; }
  g.position.y += (groundY(g.position.z) + Math.abs(Math.sin(tt * 10)) * (d > .1 ? .06 : 0) - g.position.y) * Math.min(1, dt * 12);
}
frame();
addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);

/* ---------- écran titre ---------- */
if (saved){ $('#play').textContent = 'Continuer'; $('#reset').hidden = false; }
cam.tz = cam.z = 6; cam.tdist = cam.dist = 30;
$('#play').addEventListener('click', () => { $('#intro').classList.add('hide'); cam.tz = -1.5; cam.tdist = innerWidth / innerHeight < .7 ? 30 : 24; sfx.level(); setTimeout(() => $('#intro').remove(), 600); });
let resetArmed = false;
$('#reset').addEventListener('click', () => {
  if (!resetArmed){ resetArmed = true; $('#reset').textContent = 'Toucher encore pour effacer la partie'; return; }
  try { localStorage.removeItem(SAVE_KEY); } catch(e){}
  state = newState(); for (const id of ALL_PLOTS){ plotViews[id].sig = 'x'; plotViews[id].inited = false; syncPlot(id); }
  makeSanta(); $('#reset').hidden = true; $('#play').textContent = 'Commencer';
});
</script>
